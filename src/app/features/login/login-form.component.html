<form [formGroup]="form" (ngSubmit)="submit()" [attr.aria-busy]="isSubmitting()" novalidate>
  @if (errorMessage(); as message) {
    <div class="banner" role="alert" tabindex="-1" #banner>
      <mat-icon aria-hidden="true">error_outline</mat-icon>
      <span>{{ message }}</span>
    </div>
  }

  <app-field
    label="Email (required)"
    icon="mail"
    hint="Use your work email"
    [control]="form.controls.email"
    [messages]="{ required: 'Enter your email.', email: 'Enter a valid email address.' }"
  >
    <input type="email" formControlName="email" autocomplete="username" #emailInput />
  </app-field>

  <app-field
    label="Password (required)"
    icon="lock"
    [control]="form.controls.password"
    [messages]="{ required: 'Enter your password.' }"
  >
    <input
      formControlName="password"
      autocomplete="current-password"
      [type]="isPasswordHidden() ? 'password' : 'text'"
      #passwordInput
    />
    <button
      fieldSuffix
      class="field-suffix"
      type="button"
      aria-label="Show password"
      [attr.aria-pressed]="!isPasswordHidden()"
      (click)="togglePasswordVisibility()"
    >
      <mat-icon aria-hidden="true">{{
        isPasswordHidden() ? 'visibility' : 'visibility_off'
      }}</mat-icon>
    </button>
  </app-field>

  <div class="actions">
    <button mat-flat-button type="submit" [disabled]="isSubmitting()">
      @if (isSubmitting()) {
        <mat-spinner diameter="18" aria-hidden="true" />
        Signing in...
      } @else {
        Sign in
      }
    </button>
  </div>
</form>

@if (demoAccounts().length > 0) {
  <app-demo-account-picker
    [accounts]="demoAccounts()"
    [disabled]="isSubmitting()"
    (accountSelected)="fillEmail($event)"
  />
}
<p class="cdk-visually-hidden-text" aria-live="polite">{{ announcement() }}</p>
